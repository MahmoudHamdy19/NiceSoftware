    <!-- GitHub Pages SPA: Restore the path encoded by 404.html -->
    <script>
      (function() {
        // Detect base path for GitHub Pages project repos (e.g. /NiceSoftware)
        var basePath = '';
        if (window.location.hostname.endsWith('github.io')) {
          var parts = window.location.pathname.split('/');
          if (parts.length > 1 && parts[1]) {
            basePath = '/' + parts[1];
          }
        }

        // Read ?p= param set by 404.html
        var search = window.location.search;
        if (search) {
          var params = new URLSearchParams(search);
          var p = params.get('p');
          if (p) {
            var restored = basePath + '/' + p.replace(/~and~/g, '&');
            var q = params.get('q');
            var newSearch = q ? '?' + q.replace(/~and~/g, '&') : '';
            history.replaceState(null, null, restored + newSearch + window.location.hash);
          }
        }
      })();
    </script>

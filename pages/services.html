<main class="container">
    <section class="page-header animate-fade-in">
        <h1>خدماتنا</h1>
        <p>اطلب مساعدة خبرائنا في أي من مجالاتنا المتخصصة.</p>
    </section>

    <section class="grid-3" id="cms-services-container">
        <div style="text-align: center; width: 100%; grid-column: 1 / -1;">
            <p>جاري تحميل الخدمات...</p>
        </div>
    </section>

    <section style="margin-top: 80px; max-width: 600px; margin-left: auto; margin-right: auto;" class="glass-card">
        <h3 style="margin-bottom: 20px; text-align: center;">نموذج طلب سريع</h3>
        <form id="supabase-form">
            <input type="hidden" id="form-type" value="quick-request">
            <div class="form-group">
                <label>اسم صاحب الطلب</label>
                <input type="text" id="input-name" class="form-control" required placeholder="فلان الفلاني">
            </div>
            <div class="form-group">
                <label>رقم الواتساب (السعودية)</label>
                <input type="tel" id="input-phone" class="form-control" required placeholder="05XXXXXXXX" pattern="^(05)[0-9]{8}$" dir="ltr" style="text-align: right;" title="الرجاء إدخال رقم سعودي يبدأ بـ 05 ويتكون من 10 أرقام">
            </div>
            <div class="form-group">
                <label>الجامعة</label>
                <select id="input-university" class="form-control" required style="appearance: none; background: rgba(0,0,0,0.2);" onchange="this.nextElementSibling.style.display = this.value === 'other' ? 'block' : 'none'; this.nextElementSibling.required = this.value === 'other';">
                    <option value="">-- اختر جامعتك --</option>
                    <option value="ksu">جامعة الملك سعود</option>
                    <option value="kau">جامعة الملك عبدالعزيز</option>
                    <option value="kfupm">جامعة الملك فهد للبترول والمعادن</option>
                    <option value="imsiu">جامعة الإمام محمد بن سعود</option>
                    <option value="pnu">جامعة الأميرة نورة</option>
                    <option value="uqu">جامعة أم القرى</option>
                    <option value="kfu">جامعة الملك فيصل</option>
                    <option value="kku">جامعة الملك خالد</option>
                    <option value="qu">جامعة القصيم</option>
                    <option value="taibahu">جامعة طيبة</option>
                    <option value="tu">جامعة الطائف</option>
                    <option value="ju">جامعة جازان</option>
                    <option value="ut">جامعة تبوك</option>
                    <option value="seu">الجامعة السعودية الإلكترونية</option>
                    <option value="other">جامعة أخرى / غير ذلك</option>
                </select>
                <input type="text" id="input-university-other" class="form-control" placeholder="اكتب اسم الجامعة هنا..." style="display: none; margin-top: 10px;">
            </div>
            <div class="form-group">
                <label>الخدمة اللي تحتاجها</label>
                <select id="input-service" class="form-control" required style="appearance: none;">
                    <option value="">اختر الخدمة</option>
                    <option value="project">مشروع تخرج</option>
                    <option value="homework">حل واجب</option>
                    <option value="course">دورة لايف</option>
                </select>
            </div>
            <div class="form-group">
                <label>التفاصيل</label>
                <textarea id="input-details" class="form-control" rows="4" placeholder="اشرح لنا وش تحتاج بالضبط..." required></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%;">إرسال الطلب</button>
        </form>
    </section>
</main>
